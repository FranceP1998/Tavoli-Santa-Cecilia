<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piano tavoli – Santa Cecilia</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700&family=Piazzolla:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--ti:"Piazzolla",Georgia,serif;--nm:"Karla","Avenir Next",system-ui,sans-serif;--sys:"Space Mono",ui-monospace,Menlo,Consolas,monospace;--bg:#F6E1C9;--card:#fff;--ink:#1C1C1F;--navy:#1E1937;--or:#EF7135;--ye:#F0BC0F;--sa:#7EA681;--mut:#5b5868;--line:#d8c9b2;--acc:#1E1937;--brass:#e4e4e4;--brassl:#8a8a8a;--ok:#008367;--okbg:#e3efe5;--bad:#620E1C}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.35 var(--nm);color:var(--ink);background:var(--bg);height:100vh;height:100dvh;display:flex;flex-direction:column}
header{font:12.5px/1.3 var(--sys);display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:4px solid var(--or);flex-wrap:wrap}.logo{height:34px}
h1{font:600 20px var(--ti);margin:0 10px 0 0;color:var(--navy)}
button,select,input[type=search]{font:12.5px/1.3 var(--sys);padding:5px 10px;border:1px solid var(--navy);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer}
button:hover{border-color:var(--or);background:#fff4ea}button:focus-visible,.g:focus-visible{outline:2px solid var(--or);outline-offset:1px}
button.pri,.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{flex:1;display:flex;min-height:0}
aside{width:260px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ah{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.ah input{width:100%;cursor:text;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:12.5px/1.3 var(--sys)}.bad{color:var(--bad);font-weight:600}.mut{color:var(--mut);font:12px/1.4 var(--sys)}#cnt{font:12px/1.4 var(--sys)}
#gl{overflow:auto;padding:8px;flex:1}
.g{padding:5px 8px;border:1px solid var(--line);border-radius:5px;margin-bottom:4px;cursor:grab;display:flex;justify-content:space-between;background:#fff}
.g.done{background:var(--okbg);border-color:var(--sa);color:var(--ok)}.g.sel,.seat.sel{background:var(--ye)!important;border-color:var(--navy)!important;color:var(--ink)}.g small{color:var(--mut);font:11px var(--sys)}
#stage{flex:1;overflow:auto;padding:14px}
.ptitle{font:600 22px var(--ti);margin:0 0 24px;text-align:center}
#canvas{position:relative}
.lot{position:absolute;display:flex;align-items:center;justify-content:center;height:40px;border:2px solid var(--ink);border-radius:8px;background:#fff;font:600 21px var(--ti);letter-spacing:.04em}
.g.gone{color:var(--bad);border:2px solid var(--bad)}.seat.full.gone{background:var(--bad);border:2px solid var(--or)}.seat.full.gone span,.seat.full.gone .x{color:#fff}
.tbl{position:absolute;width:370px;background:#fff;border:1px solid #c4c4c4;border-radius:8px;padding:8px}
.th{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.th strong{font:600 16px var(--ti)}.cnt{color:var(--mut);font:11px var(--sys)}
.ctl{font-family:var(--sys);display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}.ctl button,.ctl label{font-size:12px;padding:2px 6px}.ctl label{display:flex;gap:3px;align-items:center}
.tb{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);gap:4px}
.bar{background:#d4d4d4;border:1px solid #9a9a9a;border-radius:3px}
.seat{cursor:pointer;min-width:0;height:var(--sh,26px);border:1px solid #c4c4c4;border-radius:4px;padding:0 18px;position:relative;display:flex;align-items:center;background:#fff;margin-bottom:2px}
.seat.full{background:var(--brass);border-color:var(--brassl)}.seat.over{outline:2px solid var(--ink)}
.seat span{font-weight:600;font-size:12.5px;white-space:var(--ws,nowrap);line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center}
.x{font-style:normal;color:var(--bad);cursor:pointer;padding:0 3px;position:absolute;right:3px;top:50%;transform:translateY(-50%)}
.head{width:180px;margin:0 auto 4px}.head.b{margin:4px auto 0}
#list{background:#fff;padding:18px;border:1px solid var(--line);border-radius:8px}
#lcols{display:grid;gap:18px;align-items:start;font-size:14px}
.grp{margin-bottom:6px}
.letter{font:700 1.6em/1.1 var(--ti);border-bottom:2px solid var(--ink);margin-bottom:2px;break-after:avoid}
.row{display:flex;align-items:baseline;padding:0;break-inside:avoid;line-height:1.3}.row .dots{flex:1;min-width:12px;margin:0 5px;border-bottom:2px dotted #8f8f8f;transform:translateY(-2px)}.row b{font:400 .8em var(--sys);text-align:right;white-space:nowrap}.row i{font-style:normal;color:var(--bad)}
#toast{font:12.5px/1.4 var(--sys);position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;max-width:80vw}
dialog{border:1px solid var(--line);border-radius:10px;padding:18px;min-width:340px}dialog label{display:block;margin:8px 0}dialog select{width:100%}
menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:14px 0 0}
.lotf{display:flex;align-items:center;justify-content:center;height:40px;border:2px solid var(--ink);border-radius:8px;background:#fff;font:600 19px var(--ti);letter-spacing:.04em;margin-bottom:12px}
.ovg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:stretch}
.tile{display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid #8a8a8a;border-radius:8px;background:#fff;font:600 15px var(--ti);cursor:pointer;padding:4px}
.tile:active{background:var(--ye)}.tile.gone{background:var(--bad);color:#fff;border-color:var(--or)}
.nav{display:flex;gap:6px;margin-bottom:10px}.nav button{flex:1}.nav button:disabled{opacity:.35}
.hint{display:none}
@media(hover:none){.hint{display:block}}
@media(max-width:760px){
 header{padding:6px 8px;gap:6px}h1{font-size:16px;margin:0}header button,header select{padding:6px 8px}.logo{height:26px}
 main{display:block;overflow:auto}
 aside{width:auto;max-height:42vh;overflow:auto;position:sticky;top:0;z-index:5;border-right:0;border-bottom:2px solid var(--or)}
 #gl{overflow:visible;flex:none}#stage{overflow:visible;padding:8px}
 .ptitle{font-size:17px;margin-bottom:12px}#list{padding:10px}
}
body.pm .ptitle{font-size:16px;margin:0 0 20px}
body.pm .lot{height:32px;font-size:18px}
body.pm .tbl{width:256px;padding:5px}
body.pm .th{margin-bottom:3px}body.pm .th strong{font-size:15px}body.pm .cnt{font-size:11px}
body.pm .ctl,body.pm .x{display:none}
body.pm .tb{grid-template-columns:minmax(0,1fr) 8px minmax(0,1fr);gap:3px}
body.pm .seat{padding:0 4px}body.pm .seat span{font-size:13px}
body.pm .head{width:150px}
body.pm #list{width:690px;border:0;padding:0;border-radius:0}
@media print{
 header,aside,.ctl,#toast,.x{display:none!important}
 body{display:block;height:auto;background:#fff}main{display:block}#stage{overflow:visible;padding:0}
 #list{border:0;padding:0}.tbl,.lot{border-color:#444}.seat,.seat.full{border-color:#555;background:#fff!important}.seat.full.gone{border:1px solid #555!important}.seat.full.gone span{color:#000!important}.bar{background:#eee;border-color:#999}
}
</style></head><body>
<header>
 <img class="logo" src="logo-orizzontale.svg" alt="Corpo Musicale G. Verdi" onerror="this.remove()">
 <h1>Piano tavoli · Santa Cecilia</h1>
 <button id="bAdd">Aggiungi tavolo</button>
 <button id="bUndo">Annulla</button>
 <span class="tabs"><button data-v="plan" class="on">Pianta</button> <button data-v="list">Elenco alfabetico</button></span>
 <label id="colsL" hidden>Colonne <select id="cols"><option>2</option><option selected>3</option><option>4</option></select></label>
 <span style="flex:1"></span>
 <button id="bSave">Salva file</button><button id="bOpen">Apri file</button><button id="bPrint" class="pri">Stampa</button>
 <input type="file" id="fJson" accept=".json" hidden>
</header>
<main>
 <aside><div class="ah"><div id="cnt"></div><input type="search" id="q" placeholder="Cerca un nome">
  <select id="filt"><option value="todo">Da assegnare</option><option value="all">Tutti gli invitati</option></select>
  <div style="display:flex;gap:6px;align-items:center"><div id="sync" class="mut" style="flex:1"></div><button id="bRef" hidden>Aggiorna ora</button></div>
  <div id="pstat" class="mut"></div>
  <div class="hint mut">Tocca un nome della lista, poi il posto dove metterlo. Tocca un posto occupato per spostarlo.</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button id="bSaveNow" hidden>Salva ora</button><button id="bLoadRemote" hidden>Carica dal foglio</button><button id="bForce" hidden>Sovrascrivi con il mio</button><button id="bVer" hidden>Versioni salvate</button></div>
</div>
  <div id="gl"></div></aside>
 <section id="stage">
  <div id="plan"><h2 class="ptitle">Pranzo di Santa Cecilia 2026 - Mappa dei tavoli</h2><div id="canvas"></div></div>
  <div id="list" hidden><h2 class="ptitle">Pranzo di Santa Cecilia 2026 - Elenco Alfabetico</h2><div id="lcols"></div></div>
 </section>
</main>
<dialog id="dh"><form method="dialog"><h3 style="margin:0 0 8px;font:600 18px var(--ti)">Versioni salvate</h3><div id="dhl" style="max-height:50vh;overflow:auto;min-width:300px"></div><menu><button value="x">Chiudi</button></menu></form></dialog>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1).toLowerCase():'';
function newT(s,i){return{id:'t'+(s.next++),x:10+(i%3)*345,y:10+Math.floor(i/3)*450,rows:12,ht:false,hb:false}}
function fresh(){const s={guests:[],tables:[],seats:{},next:1};for(let i=0;i<6;i++)s.tables.push(newT(s,i));return s}
function load(){try{const s=JSON.parse(localStorage.getItem('pianoTavoli'));return s&&s.tables?s:null}catch(e){return null}}
let S=load()||fresh(),hist=[],view='plan',R={},rows0=[];
S.guests.forEach(g=>{g.l??=((g.c||'')+' '+(g.n||'')).trim()});S.guests=S.guests.filter(g=>!g.m);delete S.del;
let sel=null,mview=null;
const save=noRemote=>{try{localStorage.setItem('pianoTavoli',JSON.stringify(S))}catch(e){}if(!noRemote)schedRemote()};
const push=()=>{hist.push(JSON.stringify(S));if(hist.length>60)hist.shift()};
const seatIds=t=>{const a=[];if(t.ht)a.push(t.id+'-T');for(let i=0;i<t.rows;i++)a.push(t.id+'-L'+i,t.id+'-R'+i);if(t.hb)a.push(t.id+'-B');return a};
const cmp=(a,b)=>a.l.localeCompare(b.l,'it');
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,6000)}
function clean(){const ok=new Set(S.tables.flatMap(seatIds)),ids=new Set(S.guests.map(g=>g.id)),used=new Set();
 for(const s in S.seats){const g=S.seats[s];if(!ok.has(s)||!ids.has(g)||used.has(g))delete S.seats[s];else used.add(g)}
 S.guests=S.guests.filter(g=>!g.gone||used.has(g.id))}
const tc=x=>x.toLowerCase().replace(/(^|[\s'’\-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const names=()=>{const m={};S.guests.forEach(g=>m[g.id]=tc(g.l));return m};
function render(){
 clean();const nm=names(),by={},where={};S.guests.forEach(g=>by[g.id]=g);
 S.tables.forEach((t,i)=>seatIds(t).forEach(s=>{if(S.seats[s])where[S.seats[s]]=i+1}));R={nm,where};
 const tot=S.guests.length,as=Object.keys(where).length,seats=S.tables.reduce((a,t)=>a+seatIds(t).length,0);
 $('#cnt').innerHTML=`Assegnati <b>${as}</b> su ${tot}<br><span class="${seats<tot?'bad':'mut'}">Posti disponibili: ${seats}</span>`;
 const f=$('#filt').value,q=norm($('#q').value);
 const a=[...S.guests].sort(cmp).filter(g=>(f=='all'||!where[g.id])&&(!q||norm(g.l).includes(q)));
 $('#gl').innerHTML=a.map(g=>`<div class="g ${where[g.id]?'done':''} ${g.gone?'gone':''} ${sel&&sel.t=='g'&&sel.id==g.id?'sel':''}" draggable="true" data-g="${esc(g.id)}">${esc(nm[g.id])}<span>${where[g.id]?`<small>Tavolo ${where[g.id]}</small>`:''}</span></div>`).join('')
  ||`<p class="mut">${tot?(f=='todo'?'Tutti gli invitati hanno un posto.':'Nessun risultato.'):'Sto aspettando l’elenco dal foglio delle prenotazioni…'}</p>`;
 const seat=(id,cl='')=>{const g=S.seats[id];return `<div class="seat ${cl} ${g?'full':''} ${g&&by[g]&&by[g].gone?'gone':''} ${sel&&sel.t=='s'&&sel.id==id?'sel':''}" data-s="${id}" ${g?'draggable="true"':''}><span ${g?`data-full="${esc(nm[g])}"`:''}>${g?esc(nm[g]):''}</span>${g?`<i class="x" data-x="${id}" title="Togli dal posto">×</i>`:''}</div>`};
 $('#canvas').innerHTML='<div class="lot">Lotteria</div>'+S.tables.map((t,i)=>{let L='',Rr='';for(let k=0;k<t.rows;k++){L+=seat(`${t.id}-L${k}`);Rr+=seat(`${t.id}-R${k}`)}
  const n=seatIds(t),fl=n.filter(s=>S.seats[s]).length;
  return `<div class="tbl" data-t="${t.id}" style="left:${t.x}px;top:${t.y}px"><div class="th"><strong>Tavolo ${i+1}</strong><span class="cnt">${fl} / ${n.length} posti</span></div>
  <div class="ctl"><button data-a="r-">− fila</button><button data-a="r+">+ fila</button><label><input type="checkbox" data-a="ht" ${t.ht?'checked':''}>capotavola sopra</label><label><input type="checkbox" data-a="hb" ${t.hb?'checked':''}>sotto</label><button data-a="clr">Svuota tavolo</button><button data-a="del">Elimina</button></div>
  ${t.ht?seat(t.id+'-T','head'):''}<div class="tb"><div>${L}</div><div class="bar"></div><div>${Rr}</div></div>${t.hb?seat(t.id+'-B','head b'):''}</div>`}).join('');
 const mob=innerWidth<760&&!document.body.classList.contains('pm');
 if(mview&&!S.tables.some(t=>t.id==mview))mview=null;
 if(mob&&view=='plan'){
  if(mview==null){
   $('#canvas').innerHTML=`<div class="ov"><div class="mut" style="text-align:center;margin-bottom:8px">Tocca un tavolo per aprirlo</div><div class="lotf">Lotteria</div><div class="ovg">${S.tables.map((t,i)=>`<div class="tile ${seatIds(t).some(z=>by[S.seats[z]]&&by[S.seats[z]].gone)?'gone':''}" data-tile="${t.id}" style="min-height:${34+t.rows*7}px">Tavolo ${i+1}</div>`).join('')}</div></div>`}
  else{const i=S.tables.findIndex(t=>t.id==mview);$$('.tbl').forEach(e=>{if(e.dataset.t!=mview)e.remove()});$('.lot')?.remove();
   $('#canvas').insertAdjacentHTML('afterbegin',`<div class="nav"><button data-nav="prev" ${i?'':'disabled'}>‹ ${i?'Tavolo '+i:''}</button><button data-nav="ov">Pianta</button><button data-nav="next" ${i<S.tables.length-1?'':'disabled'}>${i<S.tables.length-1?'Tavolo '+(i+2):''} ›</button></div>`)}}
 fit();
 // elenco alfabetico: una riga per ogni tavolo
 const ent={};S.guests.forEach(g=>{const e=ent[norm(g.l)]??={n:nm[g.id],t:{}},k=where[g.id]||0;e.t[k]=(e.t[k]||0)+1});
 LL=[];let cur='';Object.values(ent).sort((a,b)=>a.n.localeCompare(b.n,'it')).forEach(e=>{const L=(norm(e.n)[0]||'#').toUpperCase();if(L!=cur){cur=L;LL.push({L})}
  Object.keys(e.t).sort((a,b)=>(+a||99)-(+b||99)).forEach(k=>LL.push({n:e.n,t:(k==0?'da assegnare':'Tavolo '+k)+(e.t[k]>1?' ('+e.t[k]+')':''),u:k==0}))});
 drawList(innerWidth<760?1:+$('#cols').value)}
let LL=[];
function drawList(N){const L=$('#lcols');if(!LL.length){L.style.gridTemplateColumns='';L.innerHTML='<p class="mut">Nessun invitato importato.</p>';return}
 // si cambia colonna solo al cambio di lettera, bilanciando l'altezza delle colonne
 const G=[];LL.forEach(l=>{if(l.L)G.push([l]);else G[G.length-1].push(l)});
 const gw=g=>g.reduce((a,l)=>a+(l.L?1.8:1),0),fits=H=>{let c=1,h=0;for(const g of G){const w=gw(g);if(w>H)return false;if(h+w>H){c++;h=0}h+=w}return c<=N};
 let lo=Math.max(...G.map(gw)),hi=G.reduce((a,g)=>a+gw(g),0);for(let i=0;i<30;i++){const m=(lo+hi)/2;fits(m)?hi=m:lo=m}
 const cols=[[]];let h=0;G.forEach(g=>{const w=gw(g);if(h+w>hi+1e-6&&cols.length<N){cols.push([]);h=0}cols[cols.length-1].push(...g);h+=w});
 L.style.gridTemplateColumns=`repeat(${N},1fr)`;
 L.innerHTML=cols.map(c=>`<div>${c.map(l=>l.L?`<div class="letter">${l.L}</div>`:`<div class="row"><span>${esc(l.n)}</span><span class="dots"></span><b>${l.u?`<i>${l.t}</i>`:l.t}</b></div>`).join('')}</div>`).join('')}
function fit(){if(view!='plan')return;if($('.ov')){$('#canvas').style.height='';return}
 const pm=document.body.classList.contains('pm'),mob=!pm&&innerWidth<760,COLS=mob?1:3,TW=pm?256:mob?Math.max(250,Math.min(370,$('#stage').clientWidth-20)):370,GAP=pm?8:15,VG=pm?14:40,o=pm?0:10;
 if(!pm){const r=document.documentElement.style;mob?r.setProperty('--sh','34px'):r.removeProperty('--sh')}
 $$('.tbl').forEach(e=>e.style.width=mob?TW+'px':'');
 const lines=pm&&parseInt(document.documentElement.style.getPropertyValue('--sh'))>=30?2:1;
 document.documentElement.style.setProperty('--ws',lines>1?'normal':'nowrap');
 // se il nome non entra: si abbreviano a iniziale le parole dall'ultima in poi (Premoli F. / Mazzei L. F.), il primo cognome resta intero
 $$('.seat.full span').forEach(sp=>{const w=sp.dataset.full.split(' ');sp.textContent=w.join(' ');
  const over=()=>sp.scrollWidth>sp.clientWidth||sp.offsetHeight>lines*1.2*parseFloat(getComputedStyle(sp).fontSize);
  for(let k=w.length-1;k>=1&&over();k--)sp.textContent=w.map((x,i)=>i>=k?x[0]+'.':x).join(' ')});
 const lot=$('.lot'),nav=$('.nav'),LW=COLS*TW+(COLS-1)*GAP;if(lot){lot.style.width=LW+'px';lot.style.left=o+'px';lot.style.top=o+'px'}
 let y=o+(lot?lot.offsetHeight+(pm?14:30):0)+(nav?nav.offsetHeight+10:0),h=0;
 let k=0;S.tables.forEach(t=>{const e=$(`.tbl[data-t="${t.id}"]`);if(!e)return;const c=k++%COLS;if(c==0&&k>1){y+=h+VG;h=0}
  t.x=o+c*(TW+GAP);t.y=y;e.style.left=t.x+'px';e.style.top=y+'px';h=Math.max(h,e.offsetHeight)});
 $('#canvas').style.height=(y+h+(pm?0:20))+'px'}
// CSV
function buildGuests(rows){const seen={},out=[];
 rows.forEach(r=>{const l=(r[0]||'').trim().replace(/\s+/g,' ');if(!l)return;const b=norm(l);seen[b]=(seen[b]||0)+1;out.push({id:b+'|'+seen[b],l})});return out}
function mergeList(g,src){const cur=new Map(S.guests.map(x=>[x.id,x])),nw=new Set(g.map(x=>x.id)),seated=new Set(Object.values(S.seats));
 const add=g.filter(x=>!cur.has(x.id)),back=g.filter(x=>cur.get(x.id)?.gone),
  gone=S.guests.filter(x=>!nw.has(x.id)&&!x.gone&&seated.has(x.id)),lost=S.guests.filter(x=>!nw.has(x.id)&&!seated.has(x.id));
 if(!add.length&&!back.length&&!gone.length&&!lost.length)return null;
 push();const first=!S.guests.length;
 S.guests=[...g.map(x=>({id:x.id,l:x.l})),...S.guests.filter(x=>!nw.has(x.id)&&seated.has(x.id)).map(x=>({id:x.id,l:x.l,gone:1}))];
 save(1);render();const nm=x=>tc(x.l);
 if(first)return `${g.length} invitati caricati (${src}).`;
 return `${src}: ${add.length} nuovi, ${lost.length} tolti`+(lost.length?' ('+lost.map(nm).join(', ')+')':'')+'.'+(gone.length?` Attenzione: ${gone.map(nm).join(', ')} non c’è più nel foglio ma ha un posto: è segnato in rosso, toglilo dal posto con la × quando vuoi.`:'')}
// azioni
$('#bAdd').onclick=()=>{push();S.tables.push(newT(S,S.tables.length));save();render()};
$('#bUndo').onclick=undo;function undo(){if(!hist.length)return toast('Niente da annullare.');S=JSON.parse(hist.pop());save();render()}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='z'&&!/INPUT/.test(e.target.tagName)){e.preventDefault();undo()}});
$('#q').oninput=$('#filt').onchange=$('#cols').onchange=render;
$$('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;$$('.tabs button').forEach(x=>x.classList.toggle('on',x==b));$('#plan').hidden=view!='plan';$('#list').hidden=view!='list';$('#colsL').hidden=view!='list';render()});
$('#bPrint').onclick=()=>{if(window.self!==window.top)toast('Sei in un’anteprima, dove la stampa è bloccata: scarica il file e aprilo con il browser.');try{window.print()}catch(e){toast('Stampa non riuscita: prova con Ctrl+P (o Cmd+P).')}};
$('#bSave').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='piano-tavoli.json';a.click()};
$('#bOpen').onclick=()=>$('#fJson').click();
$('#fJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const s=JSON.parse(await f.text());if(!s.tables||!s.guests)throw 0;push();S=s;save();render()}catch(x){toast('Questo non sembra un file del piano tavoli.')}};
document.addEventListener('click',e=>{
 const x=e.target.closest('[data-x]');if(x){push();delete S.seats[x.dataset.x];save();return render()}
 const a=e.target.closest('[data-a]');if(!a||a.type=='checkbox')return;const t=S.tables.find(t=>t.id==a.closest('.tbl').dataset.t);
 if(a.dataset.a=='del'){if(!confirm('Eliminare questo tavolo? I nomi tornano nella lista da assegnare e i tavoli successivi cambiano numero.'))return;push();S.tables=S.tables.filter(y=>y!=t)}
 else if(a.dataset.a=='clr'){const ids=seatIds(t).filter(z=>S.seats[z]);if(!ids.length)return toast('Il tavolo è già vuoto.');
  if(!confirm(`Togliere tutti i nomi dal tavolo ${S.tables.indexOf(t)+1} (${ids.length} persone)? I posti restano.`))return;push();ids.forEach(z=>delete S.seats[z])}
 else{push();t.rows=Math.max(1,Math.min(30,t.rows+(a.dataset.a=='r+'?1:-1)))}save();render()});
document.addEventListener('change',e=>{const a=e.target.closest('input[data-a]');if(!a)return;const t=S.tables.find(t=>t.id==a.closest('.tbl').dataset.t);push();t[a.dataset.a]=a.checked;save();render()});
// trascinamento nomi
let over=null;const clr=()=>{over&&over.classList.remove('over');over=null};
document.addEventListener('dragstart',e=>{const g=e.target.closest('[data-g]'),s=e.target.closest('.seat.full');
 const v=g?'g:'+g.dataset.g:s?'s:'+s.dataset.s:null;if(!v)return e.preventDefault();e.dataTransfer.setData('text/plain',v);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const s=e.target.closest('.seat'),side=e.target.closest('aside');if(s||side){e.preventDefault();clr();if(s){s.classList.add('over');over=s}}});
document.addEventListener('drop',e=>{const d=e.dataTransfer.getData('text/plain');if(!d)return;const s=e.target.closest('.seat'),side=e.target.closest('aside');clr();
 if(!s&&!side)return;e.preventDefault();push();const k=d[0],v=d.slice(2);
 if(side&&!s){if(k=='s')delete S.seats[v]}
 else if(k=='g'){for(const z in S.seats)if(S.seats[z]==v)delete S.seats[z];S.seats[s.dataset.s]=v}
 else{const to=s.dataset.s;if(v==to)return;const a=S.seats[to],b=S.seats[v];if(a)S.seats[v]=a;else delete S.seats[v];S.seats[to]=b}
 save();render()});
document.addEventListener('dragend',clr);
// stampa: A4 verticale. La pianta riempie la pagina (posti più alti, nomi su due righe se servono); l'elenco si rimpicciolisce finché sta in un foglio
function pg(sz){let s=$('#pg');if(!s){s=document.createElement('style');s.id='pg';document.head.append(s)}s.textContent=`@page{size:A4 ${sz};margin:8mm}`}
function pmOn(){pg('portrait');document.body.classList.add('pm');render();
 if(view=='plan'){const R=Math.ceil(S.tables.length/3);let u=0;
  for(let r=0;r<R;r++)u+=Math.max(...S.tables.slice(r*3,r*3+3).map(t=>t.rows+(t.ht?1:0)+(t.hb?1:0)));
  const sh=Math.max(20,Math.min(44,Math.floor((985-38*R-14*(R-1))/(u||1)-2)));
  document.documentElement.style.setProperty('--sh',sh+'px');fit();
  let w=1,h=1;$$('.tbl').forEach(e=>{w=Math.max(w,e.offsetLeft+e.offsetWidth);h=Math.max(h,e.offsetTop+e.offsetHeight)});
  $('#canvas').style.zoom=Math.min(690/w,930/h,1.5)}
 else{const L=$('#lcols');for(let n=+$('#cols').value;n<=4;n++){drawList(n);let ok=0;for(let f=14;f>=6;f-=.5){L.style.fontSize=f+'px';if(L.offsetHeight<=930){ok=f;break}}if(ok>=9)break}}}
function pmOff(){document.body.classList.remove('pm');['--sh','--ws'].forEach(k=>document.documentElement.style.removeProperty(k));
 $('#canvas').style.zoom='';$('#lcols').style.fontSize='';render()}
addEventListener('beforeprint',pmOn);addEventListener('afterprint',pmOff);
if(document.fonts)document.fonts.addEventListener('loadingdone',()=>render());
// collegamento al Google Fogli delle prenotazioni (script Apps Script): la pagina lo rilegge ogni 20 secondi e quando la riapri
const LINK='https://script.google.com/macros/s/AKfycbxR3qZsEK_feZu8gf30OSHsP8gqNtvDF8w4ah08E4YXMtPA_V7fjwKcbZjxvPtJNaWb/exec?key=cmgv1875';
let SYNC=LINK,syncing=false,dragging=false;
function syncMsg(t,bad){const x=$('#sync');x.textContent=t;x.className=bad?'bad':'mut'}
async function doSync(manual){if(!SYNC||syncing||document.body.classList.contains('pm')||(dragging&&!manual))return;syncing=true;
 try{const j=await(await fetch(SYNC,{cache:'no-store'})).json();if(!j.ok)throw new Error(j.error);
  const g=buildGuests(j.names.map(x=>[x])),n0=S.guests.filter(x=>!x.gone).length;
  if(!g.length)syncMsg('Il foglio non ha nomi: non ho aggiornato. Controlla scheda e colonna nello script.',1);
  else if(n0>10&&g.length<n0/2)syncMsg('Il foglio ha molti meno nomi di prima: non ho aggiornato. Controllalo.',1);
  else{const m=mergeList(g,'Dal foglio');if(m)toast(m);syncMsg('Foglio collegato · aggiornato alle '+new Date().toLocaleTimeString('it',{hour:'2-digit',minute:'2-digit',second:'2-digit'}))}}
 catch(e){syncMsg('Non riesco a leggere il foglio: controlla la connessione e il link.',1)}
 syncing=false}
$('#bRef').onclick=()=>doSync(true);
setInterval(()=>{if(document.visibilityState=='visible')pullPlan().then(()=>doSync())},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')pullPlan().then(()=>doSync())});
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('[data-g],.seat.full'))dragging=true});
document.addEventListener('dragend',()=>dragging=false);document.addEventListener('drop',()=>dragging=false);
$('#bRef').hidden=false;syncMsg('Collegamento al foglio in corso…');

// salvataggio condiviso del piano sul Google Fogli (stesso script dell'elenco): automatico dopo ogni modifica, con controllo di versione
var PREV=0,dirty=false,remoteRev=0,conflict=false,saving=false,pulling=false,rt=null,chg=0;
try{const m=JSON.parse(localStorage.getItem('pianoTavoliMeta'));if(m){PREV=m.rev||0;dirty=!!m.dirty}}catch(e){}
const meta=()=>{try{localStorage.setItem('pianoTavoliMeta',JSON.stringify({rev:PREV,dirty}))}catch(e){}};
const hh=at=>new Date(at||Date.now()).toLocaleTimeString('it',{hour:'2-digit',minute:'2-digit'});
function planMsg(t,bad){$('#pstat').textContent=t||'';$('#pstat').className=bad?'bad':'mut';
 $('#bSaveNow').hidden=!SYNC||conflict;$('#bLoadRemote').hidden=$('#bForce').hidden=!conflict;$('#bVer').hidden=!SYNC}
function schedRemote(){if(!SYNC)return;dirty=true;chg++;meta();clearTimeout(rt);
 if(conflict)return;planMsg('Modifiche non ancora salvate…');rt=setTimeout(()=>pushPlan(),3000)}
async function pushPlan(force){if(!SYNC)return;clearTimeout(rt);if(saving){rt=setTimeout(()=>pushPlan(force),1500);return}
 saving=true;const c=chg;
 try{const j=await(await fetch(SYNC,{method:'POST',body:JSON.stringify({baseRev:force===true?remoteRev:PREV,plan:JSON.stringify(S)})})).json();
  if(j.ok){PREV=remoteRev=j.rev;conflict=false;if(chg==c){dirty=false;j.segnaposti&&j.segnaposti!='ok'?planMsg('Piano salvato, ma i segnaposti NON si sono aggiornati: '+j.segnaposti,1):planMsg('Piano salvato sul foglio alle '+hh(j.at)+(j.segnaposti?' · segnaposti aggiornati':''))}else rt=setTimeout(()=>pushPlan(),1000);meta()}
  else if(j.error=='conflict'){remoteRev=j.rev;conflict=true;planMsg('Sul foglio c’è un piano più recente del tuo: non ho salvato. Scegli cosa fare.',1)}
  else throw new Error(j.error)}
 catch(e){planMsg('Non riesco a salvare sul foglio ('+(e.message||'errore')+'): riprovo tra poco.',1);rt=setTimeout(()=>pushPlan(),10000)}
 saving=false}
function applyPlan(j){try{const x=JSON.parse(j.plan);if(!x.tables||!x.guests)throw 0;push();S=x;PREV=remoteRev=j.rev;dirty=conflict=false;meta();save(1);render();planMsg('Piano caricato dal foglio (salvato alle '+hh(j.at)+').');return true}
 catch(e){planMsg('Il piano sul foglio non è leggibile.',1);return false}}
async function pullPlan(manual){if(!SYNC||pulling||saving||document.body.classList.contains('pm')||(dragging&&!manual))return;pulling=true;
 try{const j=await(await fetch(SYNC+'&action=plan',{cache:'no-store'})).json();if(!j.ok)throw new Error(j.error);
  if(typeof j.rev!='number')throw new Error('script non aggiornato');
  remoteRev=j.rev;
  if(j.rev>PREV){
   if(!dirty&&!conflict&&(PREV>0||!Object.keys(S.seats).length)&&j.plan){if(applyPlan(j))toast('Piano aggiornato dal foglio (salvato alle '+hh(j.at)+').')}
   else{conflict=true;planMsg('Sul foglio c’è un piano più recente del tuo. Scegli cosa fare.',1)}}
  else if(j.rev==0&&Object.keys(S.seats).length&&!dirty)schedRemote();
  else if(!dirty&&!conflict)planMsg(j.rev?'Piano allineato con il foglio (salvato alle '+hh(j.at)+').':'Nessun piano ancora salvato sul foglio.')}
 catch(e){planMsg('Non riesco a leggere il piano dal foglio ('+(e.message||'errore')+'). Se hai appena aggiornato lo script, serve una nuova distribuzione.',1)}
 pulling=false}
$('#bSaveNow').onclick=()=>{if(!dirty)return toast('Il piano è già salvato sul foglio.');pushPlan()};
$('#bForce').onclick=()=>{if(confirm('Sovrascrivere il piano salvato sul foglio con il tuo? Quello attuale resta comunque nello storico.')){conflict=false;pushPlan(true)}};
$('#bLoadRemote').onclick=async()=>{if(!confirm('Caricare il piano dal foglio al posto del tuo? Le tue modifiche non salvate andranno perse.'))return;
 try{const j=await(await fetch(SYNC+'&action=plan',{cache:'no-store'})).json();if(!j.ok||!j.plan)throw 0;applyPlan(j)}catch(e){toast('Non riesco a leggere il piano dal foglio.')}};
$('#bVer').onclick=async()=>{try{const j=await(await fetch(SYNC+'&action=history',{cache:'no-store'})).json();if(!j.ok||!j.versions)throw 0;
 $('#dhl').innerHTML=j.versions.length?j.versions.map(v=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0"><span class="mut">Versione ${v.rev} · ${new Date(v.at).toLocaleString('it',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><button data-rev="${v.rev}">Ripristina</button></div>`).join(''):'<p class="mut">Nessuna versione salvata.</p>';
 $('#dh').showModal()}catch(e){toast('Non riesco a leggere le versioni: serve lo script aggiornato.')}};
$('#dhl').onclick=async e=>{const b=e.target.closest('[data-rev]');if(!b)return;
 if(!confirm('Ripristinare la versione '+b.dataset.rev+'? Il piano attuale viene sostituito (resta comunque nello storico).'))return;
 try{const j=await(await fetch(SYNC+'&action=plan&rev='+b.dataset.rev,{cache:'no-store'})).json();if(!j.ok||!j.plan)throw 0;
  const x=JSON.parse(j.plan);push();S=x;dirty=true;conflict=false;chg++;meta();save(1);render();$('#dh').close();pushPlan(true)}catch(x){toast('Ripristino non riuscito.')}};
// tocco: si seleziona un nome (o un posto occupato) e poi si tocca il posto di destinazione; funziona anche con il mouse
const place=(to,d)=>{push();const k=d[0],v=d.slice(2);
 if(k=='g'){for(const z in S.seats)if(S.seats[z]==v)delete S.seats[z];S.seats[to]=v}
 else{if(v==to)return;const a=S.seats[to],b=S.seats[v];if(a)S.seats[v]=a;else delete S.seats[v];S.seats[to]=b}
 save();render()};
document.addEventListener('click',e=>{
 if(e.target.closest('[data-x]'))return;
 const tl=e.target.closest('[data-tile]');if(tl){mview=tl.dataset.tile;render();$('main').scrollTop=0;return}
 const nv=e.target.closest('[data-nav]');if(nv){const i=S.tables.findIndex(t=>t.id==mview),d=nv.dataset.nav;mview=d=='ov'?null:((S.tables[i+(d=='next'?1:-1)]||{}).id||mview);render();$('main').scrollTop=0;return}
 const g=e.target.closest('.g[data-g]'),z=e.target.closest('.seat');
 if(g){const id=g.dataset.g;sel=sel&&sel.t=='g'&&sel.id==id?null:{t:'g',id};return render()}
 if(z){const id=z.dataset.s;
  if(sel){const d=sel.t+':'+sel.id;sel=null;if(d=='s:'+id)return render();return place(id,d)}
  if(S.seats[id])sel={t:'s',id};return render()}
 if(sel&&!e.target.closest('button,input,select,label,dialog,#toast')){sel=null;render()}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,250)});
planMsg('');render();if(SYNC){pullPlan(true).then(()=>{doSync(true);if(dirty)schedRemote()})}
</script></body></html>
